name: Test application patcher

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  patcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python3 tests/test_repack.py
